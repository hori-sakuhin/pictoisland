<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ホーム｜PictoIsland</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/group.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="home">

    <aside class="sidebar">
      <h2 class="logo">PictoIsland</h2>

      <nav class="icon">
        <a href="{{ url_for('home_page') }}"><i class="fa-solid fa-house"></i></a>
        <a href="{{ url_for('search_page') }}"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="{{ url_for('group_page') }}"><i class="fa-solid fa-users"></i></a>
        <a href="{{ url_for('prof', user_id=session['user_id']) }}"><i class="fa-regular fa-user"></i></a>
      </nav>
    </aside>


    <main class="group-main">

      <div class="group-header">
        <h1>グループ一覧</h1>
        <a class="create-btn" href="{{ url_for('group_create') }}">
          ＋ 新しいグループを作る
        </a>
      </div>

      <div class="group-list">
        {% for group in groups %}
          <div class="group-card">
            <h2>{{ group.group_name }}</h2>

            {% if group.island_image %}
              <img src="{{ url_for('static', filename=group.island_image) }}">
            {% else %}
              <img src="{{ url_for('static', filename='images/default_island.png') }}">
            {% endif %}

            <a class="enter-btn" href="/group/{{ group.id }}">この島へ</a>
          </div>
        {% else %}
          <p>まだグループがありません</p>
        {% endfor %}
      </div>

    </main>




  </div>

</body>
</html>
