<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グループ美術館</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/group_museum.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>




    <div class="gallery">
    {% for post in posts %}
        <div class="art-card">
        <img src="{{ url_for('static', filename=post.image_path) }}">
        <div class="art-info">
            <strong>{{ post.username }}</strong>
            <p>{{ post.comment }}</p>
            <small>{{ post.created_at }}</small>
        </div>
        </div>
    {% endfor %}
    </div>

    <form method="POST" enctype="multipart/form-data" class="upload-form">
        <input type="file" name="image" required>
        <input type="text" name="comment" placeholder="コメント">
        <button type="submit">展示する</button>
    </form>


    <a href="{{ url_for('group_island', group_id=group_id) }}" class="back-btn"> ← グループ島へ戻る</a>


</body>
</html>
